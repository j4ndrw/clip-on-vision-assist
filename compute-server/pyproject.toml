[project]
name = "compute-server"
version = "0.0.1"
requires-python = "==3.10.*"
dependencies = [
    "fastapi[standard]",
    "openai==1.97.1",
    "piper-tts",
    "pydub",
    "uvicorn[standard]",
    "opencv-python",
    "openwakeword",
    "vosk",
    "numpy==1.26.4",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[dependency-groups]
dev = [
    "ruff>=0.12.12",
]
